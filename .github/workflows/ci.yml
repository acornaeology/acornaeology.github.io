name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel in-flight runs on the same ref when a new commit lands, except
# on master where we want every commit's run to complete (and the Pages
# deploy, serialized separately below, must never be cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group test

      - name: Run tests
        run: uv run pytest

  # Build and deploy on a push to master, or on a manual dispatch (used to
  # republish when an upstream feeder repo changes, without a new commit
  # here). Both depend on test, so a red suite blocks the deploy. On
  # branches and PRs these jobs are skipped and only `test` runs.
  build:
    needs: test
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Build site
        run: uv run python -m generator.build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://acornaeology.uk
    # Serialize Pages deployments across runs without cancelling one
    # mid-flight (a cancelled deploy can leave the site half-updated).
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
